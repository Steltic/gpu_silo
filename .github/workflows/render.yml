name: Export design models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check the calculations and export the validated IFC4 model
        run: |
          python -m gpu_silo calcs --check
          python -m gpu_silo ifc
      - name: Export and check the editable scene models
        run: |
          python -m gpu_silo build --scene-only
          python -m gpu_silo check
          python -m gpu_silo build --scene-only --film short
          python -m gpu_silo check --film short
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-silo-models
          path: |
            renders/GPU_Silo.ifc
            renders/GPU_Silo.glb
            renders/silo_short.glb
          if-no-files-found: error
          retention-days: 14
