name: Check the design

# Check the design and export stills for review on every change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check that the calculations and the design report match the design file
        run: python -m gpu_silo calcs --check
      - name: Export, reopen and geometrically validate the complete IFC4 facility
        run: python -m gpu_silo ifc
      - name: Export and check the service and maintenance model
        run: |
          python -m gpu_silo build --scene-only
          python -m gpu_silo check
      - name: Export and check the construction model
        run: |
          python -m gpu_silo build --scene-only --film short
          python -m gpu_silo check --film short
      - name: Verify the double-speed technical cut, IFC carrier and truck clearances
        run: |
          python -m gpu_silo.technical_scene "$RUNNER_TEMP/technical-bake"
          python -m gpu_silo.technical_model "$RUNNER_TEMP/technical-bake" "$RUNNER_TEMP/technical.glb"
          python -m gpu_silo.validation.verify_technical "$RUNNER_TEMP/technical-bake" --model "$RUNNER_TEMP/technical.glb"
      - name: Install the renderer toolchain and panel typefaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-mcs libmono-system-drawing4.0-cil libgdiplus \
            fonts-liberation fonts-inter fonts-dejavu-core
      - name: Render construction and servicing stills for review
        run: |
          python -m gpu_silo stills 700 1040 1900 3500 5720 6380 8100 --output renders/stills/long
          python -m gpu_silo stills --film short 640 1460 2100 3000 3450 4100 4935 --output renders/stills/short
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-silo-stills
          path: renders/stills
          if-no-files-found: error
          retention-days: 14
